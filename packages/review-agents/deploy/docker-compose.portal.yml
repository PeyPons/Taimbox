services:
  review-portal:
    # Pin ≥ 1.30.6 por advisories nginx oct 2026 (CVE-2026-15176 et al.)
    image: nginx:1.30.6-alpine
    container_name: review-portal
    restart: unless-stopped
    ports:
      - '3010:80'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ../portal/dist:/usr/share/nginx/html:ro
      - ./nginx-review-portal.conf:/etc/nginx/conf.d/default.conf:ro
